[project]
name = "campus-resource-platform"
version = "0.1.0"
description = "Campus seat booking, classroom approval, and maintenance platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.118,<1.0",
  "sqlalchemy>=2.0.45,<3.0",
  "alembic>=1.17,<2.0",
  "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

