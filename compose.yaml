services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus-local-dev-only}
    volumes:
      - campus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["sh", "-c", "uv run --frozen --no-dev alembic -c backend/alembic.ini upgrade head && uv run --frozen --no-dev uvicorn campus_app.main:app --app-dir backend --host 0.0.0.0 --port 8000"]
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://campus:${POSTGRES_PASSWORD:-campus-local-dev-only}@db:5432/campus
      APP_REVISION: ${APP_REVISION:-local}
      RESOURCE_SERVICE_URL: http://resource:8001
      APP_SECRET: ${APP_SECRET:-local-development-only-change-me}
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      APPROVAL_TIMEOUT_HOURS: ${APPROVAL_TIMEOUT_HOURS:-24}
      WORK_ORDER_SLA_HOURS: ${WORK_ORDER_SLA_HOURS:-24}
      CHECKIN_LATE_MINUTES: ${CHECKIN_LATE_MINUTES:-15}
      CHECKIN_REMINDER_MINUTES: ${CHECKIN_REMINDER_MINUTES:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
    depends_on:
      db:
        condition: service_healthy
      resource:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  resource:
    build: .
    command: ["uv", "run", "--frozen", "--no-dev", "uvicorn", "campus_app.resource_service:app", "--app-dir", "backend", "--host", "0.0.0.0", "--port", "8001"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: .
    command: ["uv", "run", "--frozen", "--no-dev", "python", "-m", "campus_app.worker"]
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy

volumes:
  campus-postgres:
