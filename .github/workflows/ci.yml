name: CI and temporary test deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-test-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.18
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check Python style
        run: |
          uv run ruff check backend
          uv run ruff format --check backend

      - name: Test business behavior and browser flows on SQLite
        env:
          RUN_BROWSER_TESTS: "1"
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -q

      - name: Check the optional DSH bundle source
        run: |
          node --check optional-agent/dsh-campus-resource/index.js
          npm pack --dry-run ./optional-agent/dsh-campus-resource

      - name: Replay migrations from an empty database
        run: uv run alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: sqlite:////tmp/campus-migration-empty.db

      - name: Build and start a fresh PostgreSQL test environment
        run: |
          docker compose --project-name campus-ci down --volumes --remove-orphans || true
          docker compose --project-name campus-ci up --detach --build

      - name: Test business behavior on PostgreSQL
        run: |
          docker compose --project-name campus-ci run --rm --no-deps api \
            sh -c 'export TEST_POSTGRES_URL="$DATABASE_URL"; exec uv run --frozen pytest -q'

      - name: Exercise the running test environment
        run: python3 scripts/smoke_check.py

      - name: Show service logs after failure
        if: failure()
        run: docker compose --project-name campus-ci logs

      - name: Remove temporary test environment
        if: always()
        run: docker compose --project-name campus-ci down --volumes --remove-orphans


  deploy-group-test:
    needs: quality-and-test-environment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GROUP_TEST_DEPLOY == 'true'
    runs-on: [self-hosted, campus-staging]
    environment: staging
    concurrency:
      group: campus-staging-deploy
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: campus-staging
      APP_PORT: ${{ vars.APP_PORT || '8100' }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_REVISION: ${{ github.sha }}
      SEED_DEMO_DATA: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the tested commit and check the running revision
        shell: bash
        run: |
          test -n "$APP_SECRET" && test -n "$POSTGRES_PASSWORD" || exit 1
          docker compose up --build --detach --wait
          docker compose exec -T api python -c 'import json, os, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8000/health"))["revision"] == os.environ["APP_REVISION"]'
